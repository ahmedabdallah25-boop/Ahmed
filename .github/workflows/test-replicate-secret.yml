name: Test Replicate Secret

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Token is Set
        run: |
          if [ -z "${{ secrets.REPLICATE_API_TOKEN }}" ]; then
            echo "Error: REPLICATE_API_TOKEN not configured"
            exit 1
          else
            echo "✅ Replicate API token is configured and ready"
          fi
