name: Test Replicate Secret

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Replicate Secret Exists
        if: ${{ secrets.REPLICATE_API_TOKEN != '' }}
        run: echo "Replicate API token configured"

      - name: Check Token is Set
        run: |
          if [ -z "${{ secrets.REPLICATE_API_TOKEN }}" ]; then
            echo "Error: REPLICATE_API_TOKEN not configured"
            exit 1
          fi
