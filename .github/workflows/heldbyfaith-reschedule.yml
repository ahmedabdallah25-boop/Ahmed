name: HELD BY FAITH - 4. Reschedule queue

# Re-spaces the upcoming scheduled uploads: the NEXT one keeps its slot, every
# later one lands a fixed gap (default 7h) after the one before it.
#
# Dry run is ON by default — the first click always previews. Untick it to write.
#
# Channel 2 only. HBF_* secrets, and it aborts before any write unless the token
# owns UCh0tKIGR5Ns3Wvoai__txdg.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview every change without writing anything"
        type: boolean
        default: true
      gap_hours:
        description: "Hours between consecutive releases"
        default: "7"
      anchor:
        description: "Optional ISO time (2026-09-09T18:00:00Z) for the first upcoming video"
        default: ""

jobs:
  reschedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-space HELD BY FAITH schedule
        run: |
          python automation/heldbyfaith_reschedule.py \
            --gap-hours "${{ inputs.gap_hours }}" \
            ${{ inputs.anchor && format('--anchor {0}', inputs.anchor) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          HBF_CLIENT_ID: ${{ secrets.HBF_CLIENT_ID }}
          HBF_CLIENT_SECRET: ${{ secrets.HBF_CLIENT_SECRET }}
          HBF_REFRESH_TOKEN: ${{ secrets.HBF_REFRESH_TOKEN }}
