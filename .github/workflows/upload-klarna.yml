name: Upload Klarna (Part 16)

# Same shape as upload-part15.yml, pointed at klarna.json via UPLOAD_CONFIG.
# The video goes up private with a scheduled publishAt, so the title, thumbnail
# and publish time can all still be changed right up until it goes live.
#
# Reminder: workflow_dispatch only resolves on the default branch
# (claude/channel-finance-video-performance-zba5rb). This file existing on a
# feature branch alone will 404 on dispatch.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "upload = upload & schedule publish; comment = post engagement comment"
        type: choice
        options: [upload, comment]
        default: upload
      video_id:
        description: "Video ID (comment mode only)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r automation/requirements.txt
      - name: Upload video (scheduled publish)
        if: ${{ inputs.mode == 'upload' }}
        run: python automation/upload_video.py
        env:
          UPLOAD_CONFIG: klarna.json
          YT_CLIENT_ID: ${{ secrets.new1 }}
          YT_CLIENT_SECRET: ${{ secrets.new2 }}
          YT_REFRESH_TOKEN: ${{ secrets.new3 }}
      - name: Post engagement comment
        if: ${{ inputs.mode == 'comment' }}
        run: python automation/upload_video.py --comment "${{ inputs.video_id }}"
        env:
          UPLOAD_CONFIG: klarna.json
          YT_CLIENT_ID: ${{ secrets.new1 }}
          YT_CLIENT_SECRET: ${{ secrets.new2 }}
          YT_REFRESH_TOKEN: ${{ secrets.new3 }}
