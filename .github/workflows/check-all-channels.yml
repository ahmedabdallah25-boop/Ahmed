name: ALL CHANNELS - check credentials

# One click, three answers: for each channel this repo manages, are its secrets
# present, does Google still exchange the refresh token, and which channel does
# that token actually own.
#
# Why this exists, 2026-09-15: channel 2 and channel 3 each had a check workflow
# and channel 1 had none, so the only way to learn whether new1/new2/new3 still
# worked was to run a workflow that writes. That is a bad way to ask a read-only
# question. check_channel_auth.py already supported --channel finance; nothing
# dispatched it.
#
# Read-only by construction: check_channel_auth.py refreshes a token and calls
# channels?mine=true. It writes nothing, and it prints whether a secret is set,
# never its value — this repo is public and its Actions logs are world-readable.
#
# Every step is continue-on-error so one dead channel does not hide the other
# two, and the job ends green with the findings in the summary either way.

on:
  workflow_dispatch:
  schedule:
    # Mondays 08:00 UTC. A refresh token dies silently — channel 3's died
    # between 24 August and 15 September and nothing noticed until a write was
    # attempted three weeks later.
    - cron: "0 8 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Channel 1 — Finance % Decoded (new1/new2/new3)
        id: finance
        continue-on-error: true
        run: python automation/check_channel_auth.py --channel finance
        env:
          new1: ${{ secrets.new1 }}
          new2: ${{ secrets.new2 }}
          new3: ${{ secrets.new3 }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      - name: Channel 2 — HELD BY FAITH (HBF_*)
        id: heldbyfaith
        continue-on-error: true
        run: python automation/check_channel_auth.py --channel heldbyfaith
        env:
          HBF_CLIENT_ID: ${{ secrets.HBF_CLIENT_ID }}
          HBF_CLIENT_SECRET: ${{ secrets.HBF_CLIENT_SECRET }}
          HBF_REFRESH_TOKEN: ${{ secrets.HBF_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      - name: Channel 3 — Clarity in the Quran (CIQ_*)
        id: clarity
        continue-on-error: true
        run: python automation/check_channel_auth.py --channel clarity
        env:
          CIQ_CLIENT_ID: ${{ secrets.CIQ_CLIENT_ID }}
          CIQ_CLIENT_SECRET: ${{ secrets.CIQ_CLIENT_SECRET }}
          CIQ_REFRESH_TOKEN: ${{ secrets.CIQ_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Write paths, $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "| Channel | Secrets | Token |"
            echo "|---|---|---|"
            echo "| 1 — Finance % Decoded | new1 / new2 / new3 | ${{ steps.finance.outcome == 'success' && 'WORKING' || 'NOT USABLE' }} |"
            echo "| 2 — HELD BY FAITH | HBF_CLIENT_ID / HBF_CLIENT_SECRET / HBF_REFRESH_TOKEN | ${{ steps.heldbyfaith.outcome == 'success' && 'WORKING' || 'NOT USABLE' }} |"
            echo "| 3 — Clarity in the Quran | CIQ_CLIENT_ID / CIQ_CLIENT_SECRET / CIQ_REFRESH_TOKEN | ${{ steps.clarity.outcome == 'success' && 'WORKING' || 'NOT USABLE' }} |"
            echo
            echo "Open each step above for the reason behind a NOT USABLE: a missing"
            echo "secret and a rejected token look identical here and are fixed"
            echo "differently. Re-mint through \`automation/authorize.html\`."
            echo
            echo "This lists the channels the REPO manages. It cannot enumerate every"
            echo "channel on the Google account — a refresh token is bound to the one"
            echo "channel picked at Google's chooser, and no API returns the others."
            echo "For that, use the channel switcher at studio.youtube.com."
          } >> "$GITHUB_STEP_SUMMARY"
