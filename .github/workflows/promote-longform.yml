name: Promote long-form

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change, write nothing"
        type: boolean
        default: false
  schedule:
    - cron: "0 12 * * *"   # daily 12:00 UTC — re-heals links and reports the verdict

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r automation/requirements.txt
      - name: Fix, funnel and report
        working-directory: automation
        run: python promote_longform.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          YT_CLIENT_ID: ${{ secrets.new1 }}
          YT_CLIENT_SECRET: ${{ secrets.new2 }}
          YT_REFRESH_TOKEN: ${{ secrets.new3 }}

      # Search is one of only three surfaces long-form can reach on this channel,
      # and an uncaptioned 18-minute explainer gives it nothing to index.
      - name: Upload caption track
        working-directory: automation
        run: python upload_captions.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          YT_CLIENT_ID: ${{ secrets.new1 }}
          YT_CLIENT_SECRET: ${{ secrets.new2 }}
          YT_REFRESH_TOKEN: ${{ secrets.new3 }}
