<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Free 5s sample — HTML + GSAP</title>
<script src="gsap.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #05070A; }
  #stage {
    position: relative;
    width: 1080px; height: 1920px;
    background: #05070A;
    overflow: hidden;
    font-family: Inter, "Liberation Sans", Arial, sans-serif;
    color: #F7F3EA;
  }
  .row {
    position: absolute; left: 0; right: 0;
    text-align: center;
    will-change: transform, opacity;
  }
  .kicker { font-size: 58px; font-weight: 700; letter-spacing: .04em; color: #8A8F98; }
  .huge   { font-size: 260px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
  .gold   { color: #E9B949; }
  .red    { color: #FF4B4B; }
  #bar {
    position: absolute; left: 50%; width: 0; height: 4px;
    background: #E9B949; transform: translateX(-50%);
  }
  #payoff { font-size: 56px; font-weight: 800; }
</style>
</head>
<body>
<div id="stage">
  <div class="row kicker" id="k1"  style="top: 470px;">EVERY YEAR YOU HOLD CASH</div>
  <div class="row huge gold" id="n1" style="top: 560px;">100</div>
  <div id="bar" style="top: 940px;"></div>
  <div class="row kicker" id="k2"  style="top: 1030px;">INFLATION LEAVES YOU</div>
  <div class="row huge red"  id="n2" style="top: 1120px;">100</div>
  <div class="row" id="payoff" style="top: 1520px;">Nobody voted for that.</div>
</div>

<script>
// One 5-second GSAP timeline, built paused. The renderer seeks it to an exact
// time per frame (?f=N), so the capture is deterministic — no wall-clock, no
// dropped frames, no "record the screen and hope".
const FPS = 30, SECONDS = 5;
const v = {a: 100, b: 100};

const set = () => {
  document.getElementById('n1').textContent = Math.round(v.a);
  document.getElementById('n2').textContent = Math.round(v.b);
};

const tl = gsap.timeline({paused: true, onUpdate: set});

tl.from('#k1', {y: 40, opacity: 0, duration: .45, ease: 'power3.out'}, 0.05)
  .from('#n1', {y: 60, opacity: 0, scale: .86, duration: .5, ease: 'back.out(1.5)'}, 0.25)
  .to('#bar', {width: 220, duration: .35, ease: 'power2.out'}, 1.15)
  .from('#k2', {y: 40, opacity: 0, duration: .45, ease: 'power3.out'}, 1.35)
  .from('#n2', {y: 60, opacity: 0, scale: .86, duration: .5, ease: 'back.out(1.5)'}, 1.55)
  .to(v, {b: 97, duration: .9, ease: 'power3.out'}, 2.0)
  .to('#n2', {scale: 1.12, duration: .12, ease: 'power2.out'}, 2.9)
  .to('#n2', {scale: 1, duration: .22, ease: 'power2.inOut'}, 3.02)
  .from('#payoff', {y: 44, opacity: 0, duration: .5, ease: 'back.out(1.4)'}, 3.35);

// Seek to the requested frame and hold there.
const f = Number(new URLSearchParams(location.search).get('f') || 0);
tl.time(Math.min(f / FPS, SECONDS));
set();
document.title = 'ready';
</script>
</body>
</html>
